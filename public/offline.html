<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensia - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .offline-container {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .offline-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .offline-message {
            font-size: 1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .retry-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .status-indicator {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon pulse">📱</div>
        <h1 class="offline-title">Tidak Ada Koneksi</h1>
        <p class="offline-message">
            Aplikasi Presensia membutuhkan koneksi internet untuk berfungsi dengan baik. 
            Pastikan perangkat Anda terhubung ke internet dan coba lagi.
        </p>
        <a href="/" class="retry-button" onclick="window.location.reload()">
            Coba Lagi
        </a>
        <div class="status-indicator">
            <span id="status">Memeriksa koneksi...</span>
        </div>
    </div>

    <script>
        // Check connection status
        function checkConnection() {
            const status = document.getElementById('status');
            
            if (navigator.onLine) {
                status.textContent = 'Koneksi tersedia - Mengalihkan...';
                status.style.color = '#4ade80';
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                status.textContent = 'Tidak ada koneksi internet';
                status.style.color = '#f87171';
            }
        }
        
        // Check connection every 3 seconds
        setInterval(checkConnection, 3000);
        
        // Initial check
        checkConnection();
        
        // Listen for online event
        window.addEventListener('online', () => {
            checkConnection();
        });
        
        // Listen for offline event
        window.addEventListener('offline', () => {
            document.getElementById('status').textContent = 'Koneksi terputus';
            document.getElementById('status').style.color = '#f87171';
        });
    </script>
</body>
</html>
